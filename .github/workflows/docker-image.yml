name: Live Shell Image

on:
  push:
    branches: [v2.59.0-customize]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/chromium/Dockerfile
          build-args: VERSION=v26.13.0
          push: true
          tags: |
            ghcr.io/observe-life/browserless-chromium:v2.59.0-live
            ghcr.io/observe-life/browserless-chromium:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
