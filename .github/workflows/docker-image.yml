name: Live Shell Image

on:
  push:
    branches: [v2.59.0-customize]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Base layer is built locally (official ghcr base tags are not
      # published publicly) and tagged exactly as the chromium Dockerfile
      # expects, so FROM resolves without any registry round-trip.
      - name: Build base layer
        run: |
          docker build \
            --build-arg NODE_VERSION=v26.13.0 \
            --build-arg NPM_VERSION=11.21.1 \
            -f ./docker/base/Dockerfile \
            -t ghcr.io/browserless/base:v26.13.0 .

      - name: Build chromium image
        run: |
          docker build \
            --build-arg VERSION=v26.13.0 \
            -f ./docker/chromium/Dockerfile \
            -t ghcr.io/observe-life/browserless-chromium:v2.59.0-live \
            -t ghcr.io/observe-life/browserless-chromium:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/observe-life/browserless-chromium:v2.59.0-live
          docker push ghcr.io/observe-life/browserless-chromium:latest

      - name: Save image archive (fallback delivery)
        run: |
          docker save ghcr.io/observe-life/browserless-chromium:v2.59.0-live | gzip > browserless-chromium-v2.59.0-live.tar.gz
          ls -lh browserless-chromium-v2.59.0-live.tar.gz

      - name: Upload archive to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v2.59.0-live > /dev/null 2>&1 || \
            gh release create v2.59.0-live --title "Live Shell Image" --notes "browserless-chromium image (docker load target) — built from v2.59.0-customize"
          gh release upload v2.59.0-live browserless-chromium-v2.59.0-live.tar.gz --clobber
